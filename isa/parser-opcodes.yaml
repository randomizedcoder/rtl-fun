# parser-opcodes.yaml — machine-readable parser-ISA encoding (Phase 3).
#
# Source of truth for bits: docs/analysis/patent-encodings-recovered.md, itself
# pixel-verified from the USPTO drawing sheets of US 12,461,885 (FIG 43-47).
# This table is the single place downstream artifacts are generated from: the C
# encoder/decoder (model/libparsermodel/encoding.c), the .insn header
# (toolchain/parser_insn.h), and — later — the RTL decode table and disassembler.
#
# Bit numbering: [hi, lo] inclusive, bit 0 = LSB (matches encoding.c). The
# recovered doc draws bit 31 on the left; a field it lists [hi:lo] is [hi, lo] here.
# Scope: 32-bit custom-0 forms + the custom-3 coprocessor R-form. 64-bit deferred.
#
# Assembly notation is FROZEN in docs/phase-1-isa-spec.md §1.12 (Phase-7 prose-freeze).
# The bindings that realise it — dotted-suffix bit-folding (.be/.stp/.min + Er/Miss),
# mnemonic aliases (prs.lenset{,min,add} / prs.cmpi{,ne}), destination pseudo-registers,
# and the mult:min / pmeta+N operand forms — are additive and presentation-only: every
# spelling encodes to the identical bits as its positional Hybrid form. Frozen decisions:
#   * E-bit -> `.be` suffix = E=1 (big-endian field; the model is source of truth).
#   * store/storeimm displacement -> `pmeta+N` (metadata frame, NOT load's packet pcurptr+N).
#   * CAM: a single `prs.cam` mnemonic; the paccum/pnext destination selects the D bit
#     (Accum vs Next) -- no separate `prs.camnext` (patent-faithful disassembly).
#   * the phase-1 docs' prose spellings are the CANONICAL form objdump prints.

meta:
  patent: US 12,461,885 B2
  reference: docs/analysis/patent-encodings-recovered.md
  bit_order: lsb0            # bit 0 = least-significant
  scope: 32-bit custom-0 + custom-3 coprocessor

framing:
  opcode_field: [6, 0]
  opcodes:
    custom0: 0x0b            # 32-bit parser instructions; 4-byte aligned
    custom3: 0x7b            # coprocessor moves / CAM+array programming
  fnc4_field: [10, 7]        # selects the instruction group within custom-0

# Fnc4 group map (FIG 46, p.49).
fnc4_map:
  0x0: [PLOAD, PLOADTLVLOOP, PTLVFASTLOOP]
  0x1: [PFLAGSLOOP]
  0x2: [PLENCUR, PLENDATA, PLENDATABND]
  0x3: [PLENDATATLV, PLENDATAPAD, PLENDATAEOL]
  0x4: [PSTORE]
  0x5: [PSTOREREG]
  0x6: [PSTOREIMM]
  0x7: [PEXTRACT, PLOOP, PINCCNTR, PSETCNTRBIT, PRESETCNTR]
  0x8: [PCAM, PCAMNEXT, PCAMJUMP, PCAMJUMPLOOP, PCAMJUMPTLVLOOP]
  0x9: [PARR, PARRNEXT, PARRJUMP, PARRJUMPLOOP]
  0xa: [PNEXTNODE, PSETIMM, PSETCODE, PSTP, PVARINT, PANDMASK]
  0xb: [PCMPILTB, PCMPILTEB, PCMPIGTB, PCMPIGTEB]
  0xc: [PCMPIH]
  0xd: [PCMPIB]
  0xe: [PCMPNEIB]
  0xf: [PRUNTHREAD, PINITPARSER, PEVENTLOOP, PEVENTLOOPEND, PDATAEXTRACT]

# Sz field (FIG 17). Two meanings; sub-register position 0 = first byte.
sz:
  general:      { 0: nibble, 1: byte, 2: half, 3: word }   # width = 4*(1<<Sz)
  load_store:   { 0: dword,  1: byte, 2: half, 3: word }   # 0 = 8 bytes

# Group formats. `fields` list bit ranges; `discriminator` picks the instruction.
groups:

  load:                       # Fnc4=0x0
    fnc4: 0x0
    fields:
      X:      [31, 31]        # PLOAD: src select; PTLVFASTLOOP: X=1
      D:      [30, 30]
      Sz:     [29, 28]
      Blen:   [27, 24]
      Shift:  [23, 21]
      E:      [20, 20]        # keep big-endian value
      Offset: [19, 11]
    variants:
      PLOAD:        { X: src, D: 0 }
      PLOADTLVLOOP: { X: 0, D: 1 }
      PTLVFASTLOOP: { X: 1, D: 1 }
    encoder: prs_enc_load

  length:                     # Fnc4=0x2 (cur/data/bnd)
    fnc4: 0x2
    fields:
      S:     [31, 31]
      D:     [30, 30]
      Sz:    [29, 28]
      Pos:   [27, 24]
      Shift: [23, 21]         # Shift==7 => constant-length (model convention)
      F2:    [20, 19]
      Len:   [18, 11]
    discriminator:
      by: [D, F2]
      PLENCUR:     { F2: 0 }
      PLENDATA:    { F2: 1 }
      PLENDATABND: { F2: 2, D: 0 }
    encoder: prs_enc_len

  store:                      # Fnc4=0x4
    fnc4: 0x4
    fields:
      S:      [31, 31]
      F:      [30, 30]        # frame/flags select
      Sz:     [29, 28]
      Pos:    [27, 24]
      J:      [23, 23]        # src: Accum(0) / Flags(1)
      Sind:   [22, 20]        # store index
      Offset: [19, 11]
    encoder: prs_enc_store

  storeimm:                   # Fnc4=0x6
    fnc4: 0x6
    fields:
      S:      [31, 31]
      F:      [30, 30]
      Sz:     [29, 28]
      Value:  [27, 20]
      Offset: [19, 11]
    encoder: prs_enc_storeimm

  cam:                        # Fnc4=0x8
    fnc4: 0x8
    fields:
      S:     [31, 31]
      D:     [30, 30]
      Sz:    [29, 28]
      Pos:   [27, 24]
      Func3: [23, 21]
      F:     [20, 20]         # key src: Accum(0) / Flags(1)
      Share: [19, 16]
      Miss:  [15, 11]
    discriminator:
      by: [D, Func3]
      PCAM:            { D: 0, Func3: 0 }
      PCAMNEXT:        { D: 1, Func3: 0 }
      PCAMJUMP:        { Func3: 1 }
      PCAMJUMPLOOP:    { Func3: 2 }
      PCAMJUMPTLVLOOP: { Func3: 3 }
    note: >
      The CAM key/target is a 20-bit-key/32-bit-target table entry programmed via
      the custom-3 coprocessor (see cam_key), NOT part of this instruction word.
    encoder: prs_enc_cam

  next:                       # Fnc4=0xa
    fnc4: 0xa
    fields:
      S:       [31, 31]
      V:       [30, 30]       # overlay
      Pos:     [29, 28]
      A:       [27, 27]       # PANDMASK when 1
      Payload: [26, 11]
    discriminator:
      by: [Pos, A]
      PNEXTNODE: { Pos: 0 }
      PSETIMM:   { Pos: 1 }
      PSETCODE:  { Pos: 2, V: 0 }
      PSTP:      { Pos: 2 }
      PVARINT:   { Pos: 3 }
      PANDMASK:  { A: 1 }
    encoder: prs_enc_next

  cmp_ordered:                # Fnc4=0xb — PCMPILTB/LTEB/GTB/GTEB
    fnc4: 0xb
    fields:
      S:     [31, 31]
      D:     [30, 30]
      Sz:    [29, 28]
      Pos:   [27, 24]
      Func3: [23, 21]
      Er:    [20, 19]
      Value: [18, 11]
    discriminator:
      by: [Func3]
      PCMPILTB:  { Func3: 0 }
      PCMPILTEB: { Func3: 1 }
      PCMPIGTB:  { Func3: 2 }
      PCMPIGTEB: { Func3: 3 }
    encoder: prs_enc_cmpord

  cmp_masked_byte:            # Fnc4=0xd (PCMPIB) / 0xe (PCMPNEIB)
    fnc4: [0xd, 0xe]
    fields:
      Er:    [31, 30]
      Pos:   [29, 27]
      Value: [26, 19]
      Mask:  [18, 11]
    variants:
      PCMPIB:   { fnc4: 0xd }
      PCMPNEIB: { fnc4: 0xe }
    encoder: [prs_enc_cmpib, prs_enc_cmpneib]

  cmp_half:                   # Fnc4=0xc — PCMPIH (table-only; encoder TBD)
    fnc4: 0xc
    fields:
      Er:    [31, 30]
      Pos:   [29, 27]
      N:     [27, 27]
      Value: [26, 11]

# custom-3 coprocessor R-form (FIG 43/44). Standard RISC-V R-form on 0x7b.
coprocessor:
  opcode: 0x7b
  fields:
    CoP:   [31, 29]           # 000 = parser coprocessor
    Cpreg: [28, 24]           # which p register
    C:     [23, 23]           # a.k.a. D for CAM/array delete
    S:     [22, 22]
    I:     [21, 21]           # immediate form
    R:     [20, 20]
    Rs:    [19, 15]
    Func3: [14, 12]
    Rd:    [11, 7]
  encoder: prs_enc_cop
  instrs:      # S, I, R, Func3 [, D]
    # `gas:` (in-scope moves only) is the binutils operand string for tools/parser-gen:
    # `d`/`s` are the standard RISC-V rd/rs1 GPRs, `Xpr` is the parser p-register operand
    # (Cpreg[28:24], names from p_registers), `XtuN@S` is binutils' stock N-bit-unsigned-at-S
    # bitfield operand. The split-imm11 (ld.immed) is exposed as its two raw fields until the
    # richer prose syntax (Stage 1.5) lands.
    CPPRSRD:       { S: 0, I: 0, R: 0, Func3: 0, asm: "prs.mv.x.p ireg,preg", gas: "d,Xpr" }
    CPPRSWR:       { S: 0, I: 0, R: 0, Func3: 1, asm: "prs.mv.p.x preg,ireg", gas: "Xpr,s" }
    # CPPRSWRIMM (I=1) reuses the R/Rs and Rd fields as a split 11-bit immediate:
    # imm = {Imm2[20:15], Imm1[11:7]} (bitgen.py CP32). Implemented in RTL (N2):
    # parser_decode extracts the imm, cva6_parser_wrap writes p[Cpreg]={53'b0,imm}
    # on the CPPRSWR commit-gate; the decode patch forces integer rs1/rd to x0.
    CPPRSWRIMM:    { S: 0, I: 1, R: 0, Func3: 1, asm: "prs.ld.immed preg,imm11", gas: "Xpr,Xtu5@15,Xtu5@7" }
    CPPRSRDCAM:    { S: 0, I: 0, R: 1, Func3: 0, asm: "prs.cam.read ireg,ireg", gas: "d,s,Xpr" }
    CPPRSWRCAM:    { S: 0, I: 0, R: 1, Func3: 1, D: 23, asm: "prs.cam.write/delete" }
    CPPRSRDARRAY:  { S: 1, I: 0, R: 1, Func3: 0, asm: "prs.array.read ireg,ireg", gas: "d,s,Xpr" }
    CPPRSWRARRAY:  { S: 1, I: 0, R: 1, Func3: 1, D: 23, asm: "prs.array.write/delete" }

# ABI-reachable parser registers (Cpreg selects one; the read/write set the CPPRSRD /
# CPPRSWR moves actually reach — read_preg/write_preg in rtl/cva6_parser_wrap.sv). This
# is the SINGLE SOURCE of the round-trippable context. Every entry packs its pstate_t
# field(s) into an integer word and is zero-/sign-extended on read; a CPPRSRD->CPPRSWR
# round-trip is lossless within `bits`. `access: rw` => save/restore; `ro` => telemetry.
#
# M1 (§3.1 item 4, register half) added the mid-parse POSITION registers p6/p7/p8 (writable)
# + p9 (read-only) and promoted p1/p2 read-only -> rw, so the resumable *register* set is now
# reachable and a genuine mid-parse context switch round-trips it
# (tests/cva6-parser/parser_ctxsw_mid.S + tb/parser_wrap_tb.sv Scenario 14). p8/p9 occupy FREE
# patent slots (next_pc/done have no patent p-index in FIG 42). p9 (done) is READ-ONLY: it is a
# status flag the switcher observes, not restorable cursor state — at any resumable checkpoint
# done==0, and writing done=1 to a live parse stream is a spurious mid-stream exit (out of scope).
# The remaining clobberable surfaces — the meta_mem flow_keys frame and the shared CAM — have no
# custom-3 restore path and stay the deferred M2 residual (a mid-parse switch to a STORE-ing /
# CAM-programming parse).
p_registers:
  p1:  { name: CurHdr,      fields: { cur_len: [17, 9], cur_off: [8, 0] }, access: rw }  # M1: was ro
  p2:  { name: DataHdr,     fields: { dat_len: [17, 9], dat_off: [8, 0] }, access: rw }  # M1: was ro
  p6:  { name: NodeLoopCnt, fields: { node_cnt: [15, 0] },                 access: rw }  # M1
  p7:  { name: Counters,    fields: { encap: [7, 0] },                     access: rw }  # M1
  p8:  { name: NextPc,      fields: { next_pc: [9, 0] },  access: rw, note: "free slot (no patent p-index)" }  # M1
  p9:  { name: Done,        fields: { done: [0, 0] },     access: ro, note: "free slot; read-only status flag (observed, not restored)" }  # M1
  p11: { name: Next,          fields: { next: [31, 0] },                        access: rw, extend: sign }
  p13: { name: DataBndLoop,   fields: { loop: [63, 32], databound: [31, 0] },   access: rw }
  p14: { name: ParserExitCode, fields: { code: [31, 0] },                       access: rw, extend: sign }
  p15: { name: Accum,         fields: { accum: [63, 0] },                       access: rw }
  p16: { name: Flags,         fields: { flags: [63, 0] },                       access: rw }

# Next-node address/code word (data in Next/Loop/CAM targets, NOT the instr).
next_word:
  selector_bit: 31           # 0 = address, 1 = parser code
  address:
    bits: [23, 0]            # 24-bit relative; addr = ParserInstrBase | (4*addr)
    control:
      E:  0x40000000         # encapsulation
      V:  0x20000000         # overlay
      NE: 0x10000000         # next-encap
      NV: 0x08000000         # next-overlay
  code:
    bits: [7, 0]             # negative parser code, sign-extended

# CAM key (20-bit key + 32-bit target).
cam_key:
  shared:     { Shared: [19, 16], Match: [15, 0] }        # Shared 1..15
  selector:   { Shared: [19, 16], Selector: [15, 8], Match: [7, 0] }  # Shared==0
  selector_formula: "(PC << 6) & 0xFF00"

# Parser codes (FIG 45). Negative bytes; STOP_FAIL(-13) splits normal/abnormal.
parser_codes:
  OKAY: 0
  OKAY_RET: -1
  OKAY_USE_WILD: -2
  OKAY_USE_ALT_WILD: -3
  STOP_OKAY: -4
  STOP_NODE_OKAY: -5
  STOP_SUB_NODE_OKAY: -6
  STOP_FAIL: -13
  STOP_LENGTH: -14
  STOP_UNKNOWN_PROTO: -15
  STOP_ENCAP_DEPTH: -16
  STOP_UNKNOWN_TLV: -17
  STOP_TLV_LENGTH: -18
  STOP_BAD_FLAG: -19
  STOP_FAIL_CMP: -20
  STOP_LOOP_CNT: -21
  STOP_PADDING_LIMIT: -22
  STOP_OPTION_LIMIT: -23
  STOP_MAX_NODES: -24
  STOP_COMPARE: -25
  # STOP_CNTR1..7: -26..-32

# Assembler view (Phase 7 §7.3). The single source for the binutils mnemonics +
# operand tables and the toolchain/parser_intrinsics.h wrappers, generated by
# tools/parser-gen. Each entry is one *assemblable* instruction: `group` ties it
# to a `groups:` bit-truth block (or `coprocessor`), `asm` is the mnemonic, `fixed`
# pins the discriminator + slice-canonical field values into the encoding, and
# `operands` are the remaining variable fields (each a `groups` field name), in
# assembly order. Scope = the pm_encode custom-0 set + the custom-3 moves; the rest
# of the ISA (arrays/counters/TLV loops/lifecycle) has no encoder yet and no row here.
# Size-suffix -> Sz field maps (Phase 3 §Encoding; model/libparsermodel/program.c). The suffix
# folds the Sz[29:28] field into the mnemonic (prs.load.h, prs.cam.b, ...). Two classes because
# Sz==0 means different things: 8-byte double-word for load/store, nibble for the sub-register ops.
sizes:
  loadstore: { b: 1, h: 2, w: 3, d: 0 }   # 0 = double word (8 bytes)
  general:   { n: 0, b: 1, h: 2, w: 3 }   # 0 = nibble

mnemonics:
  # `size_class` (when present) tells tools/parser-gen to fold the Sz operand into a dotted size
  # suffix and emit one binutils row per size; without it, all `operands` become positional imms.
  #
  # `prose` (Stage 1.5) adds *additive, lossless* operand sugar on top of the Hybrid syntax: it
  # maps a field to a readable form that still encodes to the exact same bits. tools/parser-gen
  # emits an extra binutils row (before the Hybrid row, so objdump prints the sugar) per sugared
  # mnemonic; the Hybrid form keeps assembling (gas falls through when the sugar keyword is absent).
  # Kinds:  ptr = `pcurptr+N` displacement (load Offset);  index = `paccum[i]` sub-register index
  # (Pos);  valmask = `value:mask` (cmp Value+Mask, consumes the field named here plus Mask).
  #
  # `suffixes` (Phase-7 prose-freeze) folds an attribute/discriminator FIELD into a dotted mnemonic
  # suffix, exactly like `size_class` folds Sz (§1.12 of phase-1-isa-spec.md). Each entry is
  # { field, bare, map }: tools/parser-gen emits one binutils row per `map` suffix (name→field value)
  # cross-producted with the size suffix, and — when `bare` is non-null — a no-suffix row with that
  # default value. The field STAYS in `operands` so the C intrinsic keeps its positional parameter
  # (presentation-only in gas); only the assembler row set changes. `bare: null` = a suffix is
  # mandatory (no bare row). Bits are unchanged: every suffixed spelling encodes identically.
  #
  # `dest` (Phase-7 prose-freeze) names a destination pseudo-register that is the *leading*
  # operand and whose keyword SELECTS a discriminator field. `{ field, map }`: the field is
  # prepended to `operands` (so the C intrinsic takes it as its first parameter) and tools/parser-gen
  # renders it in the gas rows as the `Xpc` operand (keyword→field-value table, printed by objdump).
  # This is how the single `prs.cam` mnemonic replaces the old prs.cam/prs.camnext pair: `paccum`
  # ⇒ Accum (D=0), `pnext` ⇒ Next (D=1), matching the patent's disassembly (§1.12). Bits unchanged.
  custom0:
    - { asm: prs.load,     group: load,             fixed: { X: 0, D: 0, Blen: 0, Shift: 0 }, operands: [Sz, E, Offset],        size_class: loadstore, prose: { Offset: ptr }, suffixes: [ { field: E, bare: 0, map: { be: 1 } } ] }
    - { asm: prs.lencur,   group: length,           fixed: { F2: 0 },                         operands: [D, Sz, Pos, Shift, Len], size_class: general, prose: { Pos: index }, suffixes: [ { field: S, bare: 0, map: { stp: 1 } } ] }
    - { asm: prs.store,    group: store,            fixed: { S: 0, F: 0, J: 0, Sind: 0 },     operands: [Sz, Pos, Offset],      size_class: loadstore, prose: { Pos: index } }
    - { asm: prs.storeimm, group: storeimm,         fixed: { S: 0, F: 0 },                    operands: [Sz, Value, Offset],    size_class: loadstore }
    - { asm: prs.cam,      group: cam,              fixed: { Func3: 0 },                      operands: [D, S, Sz, Pos, F, Share, Miss], size_class: general, dest: { field: D, map: { paccum: 0, pnext: 1 } }, prose: { Pos: index }, suffixes: [ { field: S, bare: 0, map: { stp: 1 } } ] }
    - { asm: prs.cmpib,    group: cmp_masked_byte,  fixed: { fnc4: 0xd },                     operands: [Er, Pos, Value, Mask], prose: { Pos: index, Value: valmask }, suffixes: [ { field: Er, bare: null, map: { stop: 0, stopnode: 1, stopsub: 2, fail: 3 } } ] }
    - { asm: prs.cmpneib,  group: cmp_masked_byte,  fixed: { fnc4: 0xe },                     operands: [Er, Pos, Value, Mask], prose: { Pos: index, Value: valmask }, suffixes: [ { field: Er, bare: null, map: { stop: 0, stopnode: 1, stopsub: 2, fail: 3 } } ] }
    - { asm: prs.nextnode, group: next,             fixed: { S: 0, V: 0, Pos: 0, A: 0 },      operands: [Payload] }
    - { asm: prs.setcode,  group: next,             fixed: { S: 0, V: 0, Pos: 2, A: 0 },      operands: [Payload] }
    - { asm: prs.stp,      group: next,             fixed: { S: 0, V: 1, Pos: 2, A: 0, Payload: 0 }, operands: [] }
  # custom-3 rows reuse coprocessor.instrs (already carry `asm:` + `gas:` there).
